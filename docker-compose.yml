version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataguard
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      CORS_ORIGINS: '${CORS_ORIGINS:-["https://vindica.me","https://www.vindica.me","http://localhost:3000"]}'
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["vindica.me","www.vindica.me","localhost","127.0.0.1"]}'
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://vindica.me}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dataguard-artefacts}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      REQUIRE_KMS_IN_PRODUCTION: ${REQUIRE_KMS_IN_PRODUCTION:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REPORT_STORAGE_DIR: ${REPORT_STORAGE_DIR:-/tmp/vindica-reports}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@vindica.me}
      ALLOW_REAL_OPT_OUTS: ${ALLOW_REAL_OPT_OUTS:-false}
      BROKER_PRIVACY_EMAILS: ${BROKER_PRIVACY_EMAILS:-{}}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      IPINFO_BASE_URL: ${IPINFO_BASE_URL:-https://api.ipinfo.io/lite}
      AZURE_COMPUTER_VISION_ENDPOINT: ${AZURE_COMPUTER_VISION_ENDPOINT:-}
      AZURE_COMPUTER_VISION_KEY: ${AZURE_COMPUTER_VISION_KEY:-}
      AZURE_CV_ENDPOINT: ${AZURE_CV_ENDPOINT:-}
      AZURE_CV_KEY: ${AZURE_CV_KEY:-}
      AZURE_COMPUTER_VISION_API_VERSION: ${AZURE_COMPUTER_VISION_API_VERSION:-v3.2}
      AZURE_COMPUTER_VISION_VISUAL_FEATURES: ${AZURE_COMPUTER_VISION_VISUAL_FEATURES:-Description,Tags,Categories,Objects}
      AZURE_COMPUTER_VISION_TIMEOUT_SECONDS: ${AZURE_COMPUTER_VISION_TIMEOUT_SECONDS:-20}
      AZURE_COMPUTER_VISION_MAX_UPLOAD_BYTES: ${AZURE_COMPUTER_VISION_MAX_UPLOAD_BYTES:-5242880}
      GOOGLE_CLOUD_VISION_API_KEY: ${GOOGLE_CLOUD_VISION_API_KEY:-}
      GOOGLE_CLOUD_VISION_BASE_URL: ${GOOGLE_CLOUD_VISION_BASE_URL:-https://vision.googleapis.com/v1/images:annotate}
      GOOGLE_CLOUD_VISION_FEATURES: ${GOOGLE_CLOUD_VISION_FEATURES:-LABEL_DETECTION,OBJECT_LOCALIZATION,SAFE_SEARCH_DETECTION,WEB_DETECTION}
      GOOGLE_CLOUD_VISION_MAX_RESULTS: ${GOOGLE_CLOUD_VISION_MAX_RESULTS:-10}
      GOOGLE_CLOUD_VISION_TIMEOUT_SECONDS: ${GOOGLE_CLOUD_VISION_TIMEOUT_SECONDS:-20}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_BASE_URL: ${HUGGINGFACE_BASE_URL:-https://api-inference.huggingface.co/models}
      HUGGINGFACE_IMAGE_CAPTION_MODEL: ${HUGGINGFACE_IMAGE_CAPTION_MODEL:-Salesforce/blip-image-captioning-large}
      HUGGINGFACE_OBJECT_DETECTION_MODEL: ${HUGGINGFACE_OBJECT_DETECTION_MODEL:-facebook/detr-resnet-50}
      HUGGINGFACE_IMAGE_CLASSIFICATION_MODEL: ${HUGGINGFACE_IMAGE_CLASSIFICATION_MODEL:-google/vit-base-patch16-224}
      HUGGINGFACE_NSFW_MODEL: ${HUGGINGFACE_NSFW_MODEL:-Falconsai/nsfw_image_detection}
      HUGGINGFACE_TIMEOUT_SECONDS: ${HUGGINGFACE_TIMEOUT_SECONDS:-25}
      HUGGINGFACE_MAX_LABELS: ${HUGGINGFACE_MAX_LABELS:-10}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      BRAVE_SEARCH_COUNTRY: ${BRAVE_SEARCH_COUNTRY:-US}
      BRAVE_SEARCH_SEARCH_LANG: ${BRAVE_SEARCH_SEARCH_LANG:-en}
      BRAVE_SEARCH_SAFESEARCH: ${BRAVE_SEARCH_SAFESEARCH:-moderate}
      BRAVE_SEARCH_TIMEOUT_SECONDS: ${BRAVE_SEARCH_TIMEOUT_SECONDS:-12}
      BRAVE_SEARCH_MAX_RESULTS: ${BRAVE_SEARCH_MAX_RESULTS:-5}
      BRAVE_SEARCH_MAX_BROKER_QUERIES: ${BRAVE_SEARCH_MAX_BROKER_QUERIES:-3}
      MAX_ACTIVE_SCANS_PER_USER: ${MAX_ACTIVE_SCANS_PER_USER:-2}
      API_REQUESTS_PER_5_MINUTES: ${API_REQUESTS_PER_5_MINUTES:-300}
      SCANS_PER_DAY: ${SCANS_PER_DAY:-10}
      EXPENSIVE_LOOKUPS_PER_HOUR: ${EXPENSIVE_LOOKUPS_PER_HOUR:-30}
      IMAGE_ANALYSES_PER_DAY: ${IMAGE_ANALYSES_PER_DAY:-10}
      MAX_REMOTE_IMAGE_BYTES: ${MAX_REMOTE_IMAGE_BYTES:-5242880}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honey.vindica.me}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
    volumes:
      - ./backend/data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-scans:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q scans,dsar,reports -c 2 -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dataguard-artefacts}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      REQUIRE_KMS_IN_PRODUCTION: ${REQUIRE_KMS_IN_PRODUCTION:-true}
      REPORT_STORAGE_DIR: ${REPORT_STORAGE_DIR:-/tmp/vindica-reports}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@vindica.me}
      ALLOW_REAL_OPT_OUTS: ${ALLOW_REAL_OPT_OUTS:-false}
      BROKER_PRIVACY_EMAILS: ${BROKER_PRIVACY_EMAILS:-{}}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      IPINFO_BASE_URL: ${IPINFO_BASE_URL:-https://api.ipinfo.io/lite}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      BRAVE_SEARCH_COUNTRY: ${BRAVE_SEARCH_COUNTRY:-US}
      BRAVE_SEARCH_SEARCH_LANG: ${BRAVE_SEARCH_SEARCH_LANG:-en}
      BRAVE_SEARCH_SAFESEARCH: ${BRAVE_SEARCH_SAFESEARCH:-moderate}
      BRAVE_SEARCH_TIMEOUT_SECONDS: ${BRAVE_SEARCH_TIMEOUT_SECONDS:-12}
      BRAVE_SEARCH_MAX_RESULTS: ${BRAVE_SEARCH_MAX_RESULTS:-5}
      BRAVE_SEARCH_MAX_BROKER_QUERIES: ${BRAVE_SEARCH_MAX_BROKER_QUERIES:-3}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honey.vindica.me}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
    volumes:
      - ./backend/data:/app/data:ro
    shm_size: '1gb'
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

  worker-honey:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q honey -c 1 -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      REQUIRE_KMS_IN_PRODUCTION: ${REQUIRE_KMS_IN_PRODUCTION:-true}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honey.vindica.me}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      REQUIRE_KMS_IN_PRODUCTION: ${REQUIRE_KMS_IN_PRODUCTION:-true}

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "127.0.0.1:5555:5555"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
