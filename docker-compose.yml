version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataguard
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://vindica.me,https://www.vindica.me,http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://vindica.me}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dataguard-artefacts}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@vindica.me}
      ALLOW_REAL_OPT_OUTS: ${ALLOW_REAL_OPT_OUTS:-false}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honey.vindica.me}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
    volumes:
      - ./backend/data:/app/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-scans:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q scans,dsar,reports -c 2 -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dataguard-artefacts}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@vindica.me}
      ALLOW_REAL_OPT_OUTS: ${ALLOW_REAL_OPT_OUTS:-false}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honey.vindica.me}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
    volumes:
      - ./backend/data:/app/data:ro
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 2g

  worker-honey:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q honey -c 1 -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-32-chars-minimum-please}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://dataguard:secret@postgres:5432/dataguard}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://dataguard:secret@postgres:5432/dataguard}
      REDIS_URL: redis://redis:6379/0
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honey.vindica.me}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
