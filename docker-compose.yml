version: '3.9'

# All sensitive values live in backend/.env (git-ignored).
# Copy backend/.env.example → backend/.env and fill in real values before starting.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dataguard
      POSTGRES_USER:     dataguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in backend/.env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL:      postgresql+asyncpg://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard
      SYNC_DATABASE_URL: postgresql://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend/data:/app/data:ro
    ports:
      - "127.0.0.1:8000:8000"   # bind to loopback only — nginx proxies externally
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-scans:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q scans,dsar,reports -c 2 -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL:      postgresql+asyncpg://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard
      SYNC_DATABASE_URL: postgresql://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend/data:/app/data:ro
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 2g

  worker-honey:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q honey -c 1 -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL:      postgresql+asyncpg://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard
      SYNC_DATABASE_URL: postgresql://dataguard:${POSTGRES_PASSWORD}@postgres:5432/dataguard
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    depends_on:
      - redis
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FLOWER_PORT: 5555
      # Protect the Flower UI with basic auth
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set in backend/.env}
    ports:
      - "127.0.0.1:5555:5555"   # loopback only

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
