# ─────────────────────────────────────────────────────────────────────────────
# Netlify — DataGuard
# Frontend: React/Vite static site
# Backend:  Netlify Functions (TypeScript, Node 20)
# Database: Supabase (set env vars in Netlify UI → Site settings → Env vars)
# Auth:     GitHub OAuth (set GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, FRONTEND_URL)
# ─────────────────────────────────────────────────────────────────────────────

[build]
  base    = "."
  command = "cd frontend && npm ci && npm run build && cd ../netlify/functions && npm ci"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# ── Function config ───────────────────────────────────────────────────────────
[functions]
  directory         = "netlify/functions"
  node_bundler      = "esbuild"
  included_files    = ["netlify/functions/_shared/**"]

# ── API routing → Netlify Functions ──────────────────────────────────────────
# Exact callback first — must precede the wildcard auth route
[[redirects]]
  from   = "/api/v1/auth/github/callback"
  to     = "/.netlify/functions/auth/github/callback"
  status = 200

[[redirects]]
  from   = "/api/v1/auth/*"
  to     = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from   = "/api/v1/scans*"
  to     = "/.netlify/functions/scans:splat"
  status = 200

# ── SPA routing — all other paths → index.html ───────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # script-src: 'unsafe-inline' can be removed once RUM is configured with a nonce
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.datadoghq-browser-agent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com https://lh3.googleusercontent.com; connect-src 'self' https:; frame-ancestors 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
