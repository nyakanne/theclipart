<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <title>Vindica Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 70% 20%, rgba(186,24,27,.24), transparent 32rem), #050507; color: #fff7e8; }
      main { width: min(88vw, 520px); border: 1px solid rgba(212,175,55,.22); background: rgba(0,0,0,.52); padding: 32px; box-shadow: 0 32px 100px rgba(0,0,0,.48); }
      img { width: 56px; height: 56px; }
      p { color: #a7a7ad; line-height: 1.6; }
      button { min-height: 44px; border: 1px solid rgba(212,175,55,.38); background: #ba181b; color: white; padding: 0 18px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/shield.svg" alt="" />
      <h1>Vindica is offline</h1>
      <p>The app shell is installed, but live scans need a network connection to reach the secure API and data providers.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
