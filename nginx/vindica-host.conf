# Host-level nginx configuration for a VPS running the Docker services on
# localhost ports 3000 and 8000. Install as /etc/nginx/sites-enabled/vindica.
server {
    listen 80;
    server_name vindica.me www.vindica.me;
    return 301 https://vindica.me$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.vindica.me;

    ssl_certificate     /etc/letsencrypt/live/vindica.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vindica.me/privkey.pem;

    return 301 https://vindica.me$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vindica.me;

    ssl_certificate     /etc/letsencrypt/live/vindica.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vindica.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        # No trailing slash: preserve /api/v1/... for FastAPI.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
