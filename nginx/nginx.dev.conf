worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    upstream backend  { server backend:8000;  keepalive 8; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;

        # Scan endpoint: tighter rate-limit (must be before /api/)
        location = /api/v1/scans {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
        }

        # Metrics: localhost only in dev
        location /metrics {
            proxy_pass http://backend;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny  all;
        }

        location / {
            proxy_pass       http://frontend;
            proxy_set_header Host $host;
        }
    }
}
